name: Xcode - Build and Analyze

# Automatic analysis runs with the simulator build in ios-build.yml.
# Keep this workflow for an explicit simulator analysis rerun.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and analyze DevTools for iOS Simulator
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and analyze
        env:
          DEVTOOLS_ANALYZE: "1"
          DEVTOOLS_BUILD_LOG: ${{ github.workspace }}/Build/Logs/simulator-analysis.log
        run: bash Scripts/build-ios.sh
      - name: Upload Xcode analysis log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: DevTools-Simulator-Analysis-Log
          path: Build/Logs/simulator-analysis.log
          if-no-files-found: warn
          retention-days: 14
